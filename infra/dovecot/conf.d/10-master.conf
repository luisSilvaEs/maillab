# infra/dovecot/conf.d/10-master.conf

# LMTP socket — Postfix drops mail here
service lmtp {
    unix_listener /var/spool/postfix/private/dovecot-lmtp {
        mode = 0666
        user = vmail
        group = vmail
    }
}

# IMAP on port 143 — the backend connects here to read mail
service imap-login {
    inet_listener imap {
        port = 143
    }
}

# Auth socket — Postfix can optionally verify credentials through Dovecot
# We're not using this for now but it's standard to include it
service auth {
    unix_listener /var/spool/postfix/private/auth {
        mode = 0666
        user = vmail
        group = vmail
    }
}